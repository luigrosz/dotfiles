exec-once = noctalia
exec-once = hyprctl setcursor macos-tahoe-cursor 24
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = /home/luigr/Documents/startup/Nextcloud-34.0.3-x86_64.AppImage

# monitor = DP-1, 3440x1440@160, 1920x0, auto
# monitor = DP-2, 1920x1080@240, 0x220, auto
# monitor = DP-1, 3440x1440@160, 1080x200, auto
# monitor = DP-2, 1920x1080@240, 0x0, auto, transform, 1

### MAIN
workspace = 1, monitor:DP-1, default:true
workspace = 6, monitor:DP-2, default:true
workspace = 10, monitor:HDMI-A-1, default:true

# monitor = HDMI-A-1, 3840x2160@60,5360x0,auto
monitor = HDMI-A-1, 1920x1080@120, 0x0, auto
monitor = DP-1, 3440x1440@160, 1920x0, auto
monitor = DP-2, 1920x1080@240, 5360x0, auto

### MULTI MONITOR DISABLED FOR CHEATING SECURITY

#monitor = HDMI-A-1, 1920x1080@120, 0x0, auto
#monitor = DP-1, 3440x1440@160, 1920x0, auto
#monitor = DP-2, 1920x1080@240, 0x0, auto


general {
  gaps_in = 5
  gaps_out = 10
}

decoration {
  rounding = 20
  rounding_power = 2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
  }
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}

$ipc = noctalia msg
$terminal = kitty
$fileManager = nemo

# Core binds
bind = SUPER, SPACE, exec, $ipc panel-toggle launcher
bind = SUPER, S, exec, $ipc controlCenter toggle
bind = SUPER, comma, exec, $ipc settings toggle

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, Q, killactive,
bind = SUPER, E, exec, $fileManager
bind = SUPER, V, togglefloating,
bind = SUPER, B, exec, helium-browser
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, J, layoutmsg, togglesplit
bind = SUPER, F, fullscreen
bind = , Print, exec, filename=~/Pictures/Screenshots/$(date +'%d-%m-%Y_%Hh-%Mm-%Ss').png && grim -g "$(slurp)" "$filename" && wl-copy < "$filename"

bind = CTRL SHIFT, L, exec, /home/luigr/Documents/scripts/toggle-mic.sh
bind = CTRL SHIFT, O, exec, /home/luigr/Documents/scripts/cycle-output.sh
bind = CTRL SHIFT, K, exec, /home/luigr/Documents/scripts/shutdown-timer.sh
bind = CTRL SHIFT, U, exec, /home/luigr/Documents/scripts/cancel-shutdown.sh

# Media keys
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

input {
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
    kb_layout = us
    kb_variant = altgr-intl
}

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

env = XCURSOR_THEME, macos-tahoe-cursor
env = XCURSOR_SIZE, 24
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND, wayland,x11
env = HYPRLAND_LOG_WLR, 1
env = _JAVA_AWT_WM_NONREPARENTING, 1
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_NO_HARDWARE_CURSORS,1

windowrule = match:class Matplotlib, float on

dwindle  {
  preserve_split = true
}


windowrule = match:class awakened-poe-trade, float on
#windowrule = match:class awakened-poe-trade, noblur on
#windowrule = match:class awakened-poe-trade, noborder on
#windowrule = match:class steam_app_2694490, float on
#windowrule = match:class steam_app_2694490, fullscreen on

windowrule = match:class scalpel, no_blur on
windowrule = match:class scalpel, no_anim on
